name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # The weekly corpus refresh. See
    # docs/adr/0013-cache-the-fetched-corpora-in-ci.md.
    - cron: "17 6 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The event is part of the group so a push to main cannot cancel the weekly
  # refresh, which is the only run that reads upstream.
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      quality: ${{ steps.filter.outputs.quality }}
      tests: ${{ steps.filter.outputs.tests }}
      conformance: ${{ steps.filter.outputs.conformance }}
      web: ${{ steps.filter.outputs.web }}
      vscode: ${{ steps.filter.outputs.vscode }}
      jetbrains: ${{ steps.filter.outputs.jetbrains }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect affected components
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          COMPONENTS="quality tests conformance web vscode jetbrains"

          emit_only() {
            for component in $COMPONENTS; do
              if [[ " $* " == *" $component "* ]]; then
                echo "$component=true" >> "$GITHUB_OUTPUT"
              else
                echo "$component=false" >> "$GITHUB_OUTPUT"
              fi
            done
          }

          emit_all() {
            emit_only $COMPONENTS
          }

          changed() {
            ! git diff --quiet "$COMPARE_SHA" "$HEAD_SHA" -- "$@"
          }

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            emit_all
            exit 0
          fi

          # The scheduled run exists to read upstream, and reaches the job that
          # does so only by being named here; it has no diff to filter on.
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            emit_only conformance
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            COMPARE_SHA="$BASE_SHA"
          elif [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" =~ ^0+$ ]]; then
            emit_all
            exit 0
          else
            COMPARE_SHA="$BEFORE_SHA"
          fi

          if changed .github/workflows/ci.yml .github/workflows/quality.yml; then
            emit_all
            exit 0
          fi

          if changed \
            apps/jetbrains \
            apps/vscode \
            apps/web-editor/src \
            packages \
            docs \
            scripts \
            '*.md' \
            .markdownlint-cli2.jsonc \
            eslint.config.mjs \
            tsconfig.json \
            vitest.config.ts \
            package.json \
            package-lock.json; then
            echo "quality=true" >> "$GITHUB_OUTPUT"
          else
            echo "quality=false" >> "$GITHUB_OUTPUT"
          fi

          if changed \
            apps/web-editor/src \
            apps/vscode/src \
            packages \
            scripts \
            vitest.config.ts \
            package.json \
            package-lock.json; then
            echo "tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "tests=false" >> "$GITHUB_OUTPUT"
          fi

          if changed \
            packages \
            scripts/check-conformance.mjs \
            scripts/conformance-cache.mjs \
            scripts/conformance-record.mjs \
            scripts/conformance-corpus.json \
            scripts/vendor-corpus.json \
            package.json \
            package-lock.json; then
            echo "conformance=true" >> "$GITHUB_OUTPUT"
          else
            echo "conformance=false" >> "$GITHUB_OUTPUT"
          fi

          if changed \
            apps/web-editor \
            packages \
            tsconfig.json \
            package.json \
            package-lock.json; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "web=false" >> "$GITHUB_OUTPUT"
          fi

          if changed \
            apps/vscode \
            packages \
            tsconfig.json \
            package.json \
            package-lock.json; then
            echo "vscode=true" >> "$GITHUB_OUTPUT"
          else
            echo "vscode=false" >> "$GITHUB_OUTPUT"
          fi

          if changed \
            apps/jetbrains \
            packages/language-server \
            packages/validator \
            tsconfig.json \
            package.json \
            package-lock.json; then
            echo "jetbrains=true" >> "$GITHUB_OUTPUT"
          else
            echo "jetbrains=false" >> "$GITHUB_OUTPUT"
          fi

  checks:
    needs: changes
    uses: ./.github/workflows/quality.yml
    with:
      run_quality: ${{ needs.changes.outputs.quality == 'true' }}
      run_tests: ${{ needs.changes.outputs.tests == 'true' }}
      run_conformance: ${{ needs.changes.outputs.conformance == 'true' }}
      refresh_conformance: ${{ github.event_name == 'schedule' }}
      run_web: ${{ needs.changes.outputs.web == 'true' }}
      run_vscode: ${{ needs.changes.outputs.vscode == 'true' }}
      run_jetbrains: ${{ needs.changes.outputs.jetbrains == 'true' }}

  deploy-web:
    needs: [changes, checks]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
